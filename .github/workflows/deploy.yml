# Publishes the site to GitHub Pages on every push to master.
#
# The build needs two values it cannot infer: BASE_PATH, because a project site
# is served from /<repo>/ rather than the domain root, and VITE_SITE_URL, which
# turns the link-preview paths in index.html into the absolute URLs Open Graph
# requires. They are written here rather than read from .env so the deployed
# site does not depend on which env file happens to be committed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait for the running one, not race it. In-progress
# runs are left alone: cancelling one mid-deploy can leave the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # `npm run build` type-checks first and, through postbuild, writes
      # dist/404.html — the SPA fallback that makes deep links resolve.
      - run: npm run build
        env:
          BASE_PATH: /ganna-portfolio/
          VITE_SITE_URL: https://kreobuddha.github.io/ganna-portfolio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
